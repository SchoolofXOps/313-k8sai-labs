# Scenario for the VRAM budget. Declared assumptions: edit these and re-run.
# precision_bytes: bytes per weight and per cache value. 2 = 16-bit, 1 = 8-bit, 0.5 = 4-bit.
precision_bytes=2
# context_tokens: tokens held in the cache for each request (prompt plus generated).
context_tokens=8192
# concurrent_requests: requests being served at the same moment on one model server.
concurrent_requests=16
# overhead_fraction: extra memory for activations and the serving framework, as a fraction of weights plus cache.
overhead_fraction=0.10
# The next two keys are read only by the Deep Dive (kv-blocks.sh).
block_tokens=16
sequence_tokens_sample=700 1500 3000 5000 8000
