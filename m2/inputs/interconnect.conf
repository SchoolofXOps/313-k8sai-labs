# Link classes for the ring all-reduce estimate.
# Declared assumptions: round numbers to show the arithmetic. They are NOT vendor specifications.
# Replace with the link speeds of your own hardware.
participants=8
# Size of the data every participant sends and receives, in GB (for example gradients of a 7B model at 2 bytes each).
message_gb=15
links=in_node_fast in_node_pcie net_400g net_100g
in_node_fast_label=in-node fast link class
in_node_fast_gb_s=450
in_node_pcie_label=in-node PCIe class
in_node_pcie_gb_s=50
net_400g_label=network 400 Gbit/s class
net_400g_gb_s=50
net_100g_label=network 100 Gbit/s class
net_100g_gb_s=12.5
