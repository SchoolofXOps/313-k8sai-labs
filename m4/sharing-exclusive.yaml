# Part 5, representation 1 — exclusive. One Pod, its own claim from a template, one whole device.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: sim-device-exclusive
  namespace: m4-sharing
spec:
  spec:
    devices:
      requests:
      - name: sim-device
        exactly:
          deviceClassName: sim-accelerator-class
---
apiVersion: v1
kind: Pod
metadata:
  name: sharing-exclusive
  namespace: m4-sharing
spec:
  resourceClaims:
  - name: sim-device
    resourceClaimTemplateName: sim-device-exclusive
  containers:
  - name: workload
    image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "env; sleep 3600"]
    resources:
      claims:
      - name: sim-device
