# Deep dive, sections 1 and 2 — one claim, read from both halves: the scheduler's allocation on the
# claim, and the kubelet's preparation through the driver (its log line and the CDI spec it wrote).
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: dd-prepare-claim
  namespace: m4-deepdive
spec:
  devices:
    requests:
    - name: sim-device
      exactly:
        deviceClassName: sim-accelerator.example.com
---
apiVersion: v1
kind: Pod
metadata:
  name: dd-prepared
  namespace: m4-deepdive
spec:
  resourceClaims:
  - name: sim-device
    resourceClaimName: dd-prepare-claim
  containers:
  - name: workload
    image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sh", "-c", "env; sleep 3600"]
    resources:
      claims:
      - name: sim-device
