# Deep dive, section 4 — a NoExecute DeviceTaintRule at resource.k8s.io/v1. It selects ONE device by
# driver, pool and device name. DEVICE_FROM_CLAIM is replaced on the page with the device read from
# taint-victim-claim's allocation, so the rule taints exactly the victim's device and no other.
apiVersion: resource.k8s.io/v1
kind: DeviceTaintRule
metadata:
  name: sim-evict-demo
spec:
  deviceSelector:
    driver: sim-accelerator.example.com
    pool: grid-core-worker
    device: DEVICE_FROM_CLAIM
  taint:
    key: sim-accelerator.example.com/evict-demo
    value: "true"
    effect: NoExecute
