metadata:
  name: hami-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/component: hami-device-plugin
    helm.sh/chart: hami-2.11.0
    app.kubernetes.io/name: hami
    app.kubernetes.io/instance: hami
    app.kubernetes.io/version: "2.11.0"
    app.kubernetes.io/managed-by: Helm
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-device-plugin
      app.kubernetes.io/name: hami
      app.kubernetes.io/instance: hami
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-device-plugin
        hami.io/webhook: ignore
        app.kubernetes.io/name: hami
        app.kubernetes.io/instance: hami
      annotations:
        checksum/hami-scheduler-config: 71caf69a9c5e11f948dffe462e8668e3664a61c033feae12fe89d952a7330b33
        checksum/hami-scheduler-device-config: 22f79a9fd2bb2b74353ca1c5021af430ffb32a4f7960abf70eccfe1575149502
    spec:
      serviceAccountName: hami-device-plugin
      priorityClassName: system-node-critical
      hostPID: true
      hostNetwork: false
      
      containers:
        - name: device-plugin
          image: docker.io/projecthami/hami:v2.11.0@sha256:caab978ed50e53163c31ed7c4650c4e6e5d8facf157f377c26e021ff5fa3e5ce
          imagePullPolicy: IfNotPresent
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh","-c", "/k8s-vgpu/bin/vgpu-init.sh /usr/local/vgpu/"]
          command:
            - nvidia-device-plugin
            - --config-file=/device-config.yaml
            - --mig-strategy=none
            - --disable-core-limit=false
            - --report-node-capacity=false
            - -v=4
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_MIG_MONITOR_DEVICES
              value: all
            - name: DEVICE_LIST_STRATEGY
              value: envvar
            - name: HOOK_PATH
              value: /usr/local
            - name: HAMI_VGPU_CACHE_ROOT
              value: "/usr/local/vgpu/containers"
            - name: HAMI_VGPU_CACHE_GRACE_PERIOD
              value: "5m"
            - name: PASS_DEVICE_SPECS
              value: "true"
            - name: NVIDIA_DRIVER_ROOT
              value: /var/lib/nvml-mock/driver
            - name: DISABLE_HAMI_CORE_FOR_WHOLE_GPU
              value: "true"
            - name: DEVICE_DISCOVERY_STRATEGY
              value: nvml
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
              - SYS_ADMIN
              drop:
              - ALL
            privileged: true
          resources:
            {}
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: lib
              mountPath: /usr/local/vgpu
            - name: ctrs
              mountPath: /usr/local/vgpu/containers
            - name: usrbin
              mountPath: /usrbin
            - name: deviceconfig
              mountPath: /config
            - name: hosttmp
              mountPath: /tmp
            - name: device-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
            - name: cdi-root
              mountPath: /var/run/cdi
            - name: dynamic-mig-state
              mountPath: /var/run/hami/dynamic-mig-state
            # We always mount the driver root at /driver-root in the container.
            # This is required for CDI detection to work correctly.
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
        - name: vgpu-monitor
          image: docker.io/projecthami/hami:v2.11.0@sha256:caab978ed50e53163c31ed7c4650c4e6e5d8facf157f377c26e021ff5fa3e5ce
          imagePullPolicy: IfNotPresent
          command:
            - "vGPUmonitor"
            - -v=4
            - --metrics-bind-address=:9394
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - SYS_ADMIN
              drop:
              - ALL
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_MIG_MONITOR_DEVICES
              value: "all"
            - name: HOOK_PATH
              value: "/usr/local/vgpu"
            - name: HAMI_RESYNC_INTERVAL
              value: "5m"
            - name: DISABLE_HAMI_CORE_FOR_WHOLE_GPU
              value: "true"
            # fake-gpu-operator validation requires the monitor to receive the
            # same driver-root configuration as the device plugin.
            - name: NVIDIA_DRIVER_ROOT
              value: /var/lib/nvml-mock/driver
            - name: HAMI_VGPU_CACHE_ROOT
              value: "/usr/local/vgpu/containers"
          ports:
            - name: metrics
              containerPort: 9394
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {}
          volumeMounts:
            - name: ctrs
              mountPath: /usr/local/vgpu/containers
            - name: dockers
              mountPath: /run/docker
            - name: containerds
              mountPath: /run/containerd
            - name: sysinfo
              mountPath: /sysinfo
            - name: hostvar
              mountPath: /hostvar
            - name: hosttmp
              mountPath: /tmp
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: ctrs
          hostPath:
            path: /usr/local/vgpu/containers
        - name: hosttmp
          hostPath:
            path: /tmp
        - name: dockers
          hostPath:
            path: /run/docker
        - name: containerds
          hostPath:
            path: /run/containerd
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: lib
          hostPath:
            path: /usr/local/vgpu
        - name: driver-root
          hostPath:
            path: /var/lib/nvml-mock/driver
            type: Directory
        - name: cdi-root
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: dynamic-mig-state
          hostPath:
            path: /var/run/hami/dynamic-mig-state
            type: DirectoryOrCreate
        - name: usrbin
          hostPath:
            path: /usr/bin
        - name: sysinfo
          hostPath:
            path: /sys
        - name: hostvar
          hostPath:
            path: /var
        - name: deviceconfig
          configMap:
            name: hami-device-plugin
        - name: device-config
          configMap:
            name: hami-scheduler-device
      nodeSelector: 
        gpu: "on"
      tolerations: 
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
