apiVersion: apps/v1
kind: Deployment
metadata:
  name: hami-scheduler
  namespace: kube-system
  labels:
    app.kubernetes.io/component: hami-scheduler
    helm.sh/chart: hami-2.11.0
    app.kubernetes.io/name: hami
    app.kubernetes.io/instance: hami
    app.kubernetes.io/version: "2.11.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: hami-scheduler
      app.kubernetes.io/name: hami
      app.kubernetes.io/instance: hami
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hami-scheduler
        app.kubernetes.io/name: hami
        app.kubernetes.io/instance: hami
        hami.io/webhook: ignore
      annotations:
        checksum/hami-scheduler-config: 71caf69a9c5e11f948dffe462e8668e3664a61c033feae12fe89d952a7330b33
        checksum/hami-scheduler-device-config: 22f79a9fd2bb2b74353ca1c5021af430ffb32a4f7960abf70eccfe1575149502
    spec:
      serviceAccountName: hami-scheduler
      priorityClassName: system-node-critical
      
      containers:
        - name: kube-scheduler
          image: registry.k8s.io/kube-scheduler:v1.37.0@sha256:a27622f132aa09cf2461ba077894a070c0186ec607366d14e805912d4804d11f
          imagePullPolicy: IfNotPresent
          command:
            - kube-scheduler
            - --config=/config/config.yaml
            - -v=4
          resources:
            {}
          volumeMounts:
            - name: scheduler-config
              mountPath: /config
        - name: vgpu-scheduler-extender
          image: docker.io/projecthami/hami:v2.11.0@sha256:caab978ed50e53163c31ed7c4650c4e6e5d8facf157f377c26e021ff5fa3e5ce
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HAMI_NODELOCK_EXPIRE
              value: "5m"
          command:
            - scheduler
            - --http_bind=0.0.0.0:9443
            - --cert_file=/tls/tls.crt
            - --key_file=/tls/tls.key
            - --extender-bind=127.0.0.1:9444
            - --scheduler-name=hami-scheduler
            - --metrics-bind-address=:9395
            - --profiling-bind-address=127.0.0.1:6060
            - --node-scheduler-policy=binpack
            - --gpu-scheduler-policy=spread
            - --node-affinity-score-weight=0
            - --force-overwrite-default-scheduler=true
            - --device-config-file=/device-config.yaml
            - --leader-elect=true
            - --leader-elect-resource-name=hami-scheduler
            - --leader-elect-resource-namespace=kube-system
            - --device-plugin-namespace=kube-system
            - --device-plugin-service-account=hami-device-plugin
            - --debug
            - -v=4
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 9395
              protocol: TCP
          resources:
            {}
          volumeMounts:
            - name: device-config
              mountPath: /device-config.yaml
              subPath: device-config.yaml
            - name: tls-config
              mountPath: /tls
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - hami-scheduler
              topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: tls-config
          secret:
            secretName: hami-scheduler-tls
        - name: scheduler-config
          configMap:
            name: hami-scheduler
        - name: device-config
          configMap:
            name: hami-scheduler-device
