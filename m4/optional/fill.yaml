# A fill Pod. Created with `kubectl create` (generateName), one at a time, until one is Pending.
# Each asks for 6144 MiB. A mock device reports 16384 MiB, so memory runs out long before slots do.
#
# The resource names are NVIDIA's and HAMi's; the devices behind them are mock devices served by a
# mock NVML library. CUDA_DISABLE_CONTROL=true is HAMi Lab 5's setting for a machine with no CUDA:
# at v2.11.0 it keeps HAMi-core out of the container, so the memory and core figures below are
# accounting only. Nothing here runs CUDA, and no cap is enforced.
apiVersion: v1
kind: Pod
metadata:
  generateName: fill-
  namespace: m4-hami
  labels:
    lab: m4-optional
    part: fill
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: ["sh", "-c", "sleep 86400"]
      env:
        - name: CUDA_DISABLE_CONTROL
          value: "true"
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: "6144"
          nvidia.com/gpucores: "10"
