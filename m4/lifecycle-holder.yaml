# Part 2 — the workload that holds an allocated synthetic device while the driver is rolled.
# It uses the chart's own DeviceClass, named after the driver. The course class arrives in part 3.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: holder-claim
  namespace: m4-lifecycle
spec:
  devices:
    requests:
    - name: sim-device
      exactly:
        deviceClassName: sim-accelerator.example.com
---
apiVersion: v1
kind: Pod
metadata:
  name: holder
  namespace: m4-lifecycle
spec:
  resourceClaims:
  - name: sim-device
    resourceClaimName: holder-claim
  containers:
  - name: holder
    image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    resources:
      claims:
      - name: sim-device
