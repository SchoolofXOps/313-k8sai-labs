# One LocalQueue per tenant, in the tenant's own namespace, pointing at that tenant's ClusterQueue.
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: research-queue
  namespace: research
spec:
  clusterQueue: research-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: data-queue
  namespace: data
spec:
  clusterQueue: data-cq
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: product-queue
  namespace: product
spec:
  clusterQueue: product-cq
