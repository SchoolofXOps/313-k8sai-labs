# The simulated fleet: the nine kwok nodes the addon-kueue-kwok layer attaches at FLEET=collision.
# The label and the toleration are the layer's own (tas-gangs-v1beta2.yaml). No topologyName, so
# admission here is decided on quota alone.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: sim-fleet
spec:
  nodeLabels:
    type: kwok
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
