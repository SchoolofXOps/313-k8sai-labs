# The simulated fleet again, this time bound to the northwind-topology levels (block, then rack),
# so Topology-Aware Scheduling decides which domain an admitted group lands in. Used by part 4.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: sim-fleet-blocks
spec:
  nodeLabels:
    type: kwok
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
  topologyName: northwind-topology
