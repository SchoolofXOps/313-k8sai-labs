# Part 2's deliberate failure: a flavour whose label no node carries. It keeps the kwok toleration,
# so every simulated node is refused on the selector and not on the taint. Never committed to the
# platform repository.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: ghost-flavor
spec:
  nodeLabels:
    northwind.example.com/pool: retired
  tolerations:
    - key: kwok.x-k8s.io/node
      operator: Equal
      value: fake
      effect: NoSchedule
