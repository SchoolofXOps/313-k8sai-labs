# Part 1, the 7-of-8 trap: the same group as gang-queued, submitted with NO queue label, so no
# queueing controller decides anything. The node selector and the kwok toleration are written by
# hand, because no flavour injects them. The scheduler places each Pod on its own, one at a time.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gang-unqueued
  namespace: data
spec:
  replicas: 8
  serviceName: gang-unqueued
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: gang-unqueued
  template:
    metadata:
      labels:
        app: gang-unqueued
    spec:
      nodeSelector:
        type: kwok
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Equal
          value: fake
          effect: NoSchedule
      containers:
        - name: holder
          image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: "4"
              memory: 1Gi
