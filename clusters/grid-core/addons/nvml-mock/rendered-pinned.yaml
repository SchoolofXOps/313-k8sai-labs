            - --imex-channel-host-path=/var/lib/nvml-mock/driver/dev/nvidia-caps-imex-channels
            - --infiniband-annotation=nvml-mock.nvidia.com/infiniband
            - --excluded-namespaces=mokka,kube-system
            - --node-name=$(NODE_NAME)
            - --health-addr=:8080
            - --agent-staged-url=http://127.0.0.1:9091/stagedz
            - --staging-lock-path=/run/nvml-mock/nri-staging.lock
            - --log-level=info
            - --log-format=json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: nri-health
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: nri-health
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: nri-health
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: nri-socket-dir
              mountPath: /var/run/nri
            # Read-only is enough to take the shared side of the lock.
            - name: staging-gate
              mountPath: /run/nvml-mock
              readOnly: true
            - name: mokka-root
              mountPath: /var/lib/nvml-mock
              readOnly: true
            - name: cdi-specs
              mountPath: /var/run/cdi
              readOnly: true
      volumes:
        # The simulated driver tree: chardevs, shims, PCI and IB sysfs, configs.
        - name: mokka-root
          hostPath:
            path: /var/lib/nvml-mock
            type: DirectoryOrCreate
        - name: mokka-profile
          configMap:
            name: nvml-mock-config
        - name: cdi-specs
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: nri-socket-dir
          hostPath:
            path: /var/run/nri
            type: DirectoryOrCreate
        - name: staging-gate
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: driver-root-link
          hostPath:
            path: /run/nvidia
            type: DirectoryOrCreate
        - name: nfd-features
          hostPath:
            path: "/etc/kubernetes/node-feature-discovery/features.d"
            type: DirectoryOrCreate
        # Directory, not DirectoryOrCreate: a node without /sys should fail
        # loudly rather than get an empty stand-in.
        - name: node-sysfs
          hostPath:
            path: /sys
            type: Directory
        - name: host-fs
          hostPath:
            path: /
            type: Directory
        - name: host-usr-bin
          hostPath:
            path: /usr/bin
            type: Directory
        - name: container-toolkit
          hostPath:
            path: /usr/local/nvml-mock
            type: DirectoryOrCreate
        - name: nvidia-container-runtime-config
          hostPath:
            path: /etc/nvidia-container-runtime
            type: DirectoryOrCreate
        - name: container-runtime-config
          hostPath:
            path: "/etc/containerd"
            type: DirectoryOrCreate
