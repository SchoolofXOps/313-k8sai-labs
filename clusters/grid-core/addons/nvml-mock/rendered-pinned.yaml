          gpu_max: 45
          memory_min: 5
          memory_max: 25
    
      # ---------------------------------------------------------------------------
      # Encoder/Decoder statistics
      # ---------------------------------------------------------------------------
      encoder_stats:
        session_count: 0
        average_fps: 0
        average_latency_us: 0
    
      fbc_stats:
        session_count: 0
        average_fps: 0
        average_latency_us: 0
    
      # ---------------------------------------------------------------------------
      # ECC configuration
      # ---------------------------------------------------------------------------
      ecc:
        mode_current: "enabled"
        mode_pending: "enabled"
        default_mode: "enabled"
        errors:
          volatile:
            single_bit:
              device_memory: 0
              l1_cache: 0
              l2_cache: 0
              register_file: 0
              texture_memory: 0
              total: 0
            double_bit:
              device_memory: 0
              l1_cache: 0
              l2_cache: 0
              register_file: 0
              texture_memory: 0
              total: 0
          aggregate:
            single_bit:
              device_memory: 0
              l1_cache: 0
              l2_cache: 0
              register_file: 0
              texture_memory: 0
              total: 0
            double_bit:
              device_memory: 0
              l1_cache: 0
              l2_cache: 0
              register_file: 0
              texture_memory: 0
              total: 0
    
      # ---------------------------------------------------------------------------
      # Retired pages
      # ---------------------------------------------------------------------------
      retired_pages:
        single_bit_retirement:
          count: 0
          addresses: []
        double_bit_retirement:
          count: 0
          addresses: []
        pending_blacklist: false
        pending_retirement: false
    
      # ---------------------------------------------------------------------------
      # Remapped rows
      # ---------------------------------------------------------------------------
      remapped_rows:
        correctable: 0
        uncorrectable: 0
        pending: false
        failure_occurred: false
        # No availability_histogram: row remapping arrived with Ampere, so Turing
        # reports the bank histogram as unsupported.
    
      # ---------------------------------------------------------------------------
      # Display configuration
      # ---------------------------------------------------------------------------
      display:
        mode: "disabled"
        active: "disabled"
    
      # ---------------------------------------------------------------------------
      # Persistence mode
      # ---------------------------------------------------------------------------
      persistence_mode: "enabled"
    
      # ---------------------------------------------------------------------------
      # Compute mode
      # ---------------------------------------------------------------------------
      compute_mode: "default"
    
      # ---------------------------------------------------------------------------
      # Addressing mode: how the GPU reaches system memory (hmm, ats or none)
      # ---------------------------------------------------------------------------
      addressing_mode: "hmm"           # x86 host kernel with HMM enabled, as on the captured node
    
      # No mig section: the T4 is not a MIG-capable board, and the mock derives
      # that from the board name, so NVML answers NVML_ERROR_NOT_SUPPORTED without
      # the profile having to declare a disabled mode it can never leave.
    
      # ---------------------------------------------------------------------------
      # GPU operation mode (GOM)
      # ---------------------------------------------------------------------------
      gpu_operation_mode:
        current: "all_on"
        pending: "all_on"
    
      # ---------------------------------------------------------------------------
      # Driver model (Windows only)
      # ---------------------------------------------------------------------------
      driver_model:
        current: "N/A"
        pending: "N/A"
    
      # ---------------------------------------------------------------------------
      # Accounting mode
      # ---------------------------------------------------------------------------
      accounting:
        mode: "disabled"
        buffer_size: 4000
    
      # ---------------------------------------------------------------------------
      # Virtualization
      # ---------------------------------------------------------------------------
      virtualization:
        mode: "none"
        host_vgpu_mode: "N/A"
    
      # ---------------------------------------------------------------------------
      # GSP Firmware
      # ---------------------------------------------------------------------------
      gsp_firmware:
        mode: "enabled"
        version: "580.65.06"
    
      # ---------------------------------------------------------------------------
      # Processes (empty at idle)
      # ---------------------------------------------------------------------------
      processes: []
    
    # =============================================================================
    # Device-specific overrides (indexed 0-3 for T4 server)
    # =============================================================================
    devices:
      - index: 0
        uuid: "GPU-00000074-0000-0000-0000-000000000000"
        serial: "0421819085400"
        pci:
          bus_id: "0000:3B:00.0"
        minor_number: 0
    
      - index: 1
        uuid: "GPU-00000074-0000-0000-0000-000000000001"
        serial: "0421819085401"
        pci:
          bus_id: "0000:86:00.0"
        minor_number: 1
    
      - index: 2
        uuid: "GPU-00000074-0000-0000-0000-000000000002"
        serial: "0421819085402"
        pci:
          bus_id: "0000:AF:00.0"
        minor_number: 2
    
      - index: 3
        uuid: "GPU-00000074-0000-0000-0000-000000000003"
        serial: "0421819085403"
        pci:
          bus_id: "0000:D8:00.0"
        minor_number: 3
    
    # =============================================================================
    # InfiniBand topology - T4 systems do not ship with IB HCAs.
    # =============================================================================
    infiniband:
      enabled: false
    
    # =============================================================================
    # PCIe topology - T4 inference card, single NUMA node, 4 GPUs.
    # Consumed by `render-pci-sysfs` to materialize a fake /sys/bus/pci tree
    # under MOCK_PCI_ROOT. C consumers such as `lspci` resolve the PCIe root
    # complex through these symlinks. The NVIDIA DRA driver does NOT: it is a
    # Go binary, and Go's os package issues raw syscalls that the LD_PRELOAD
    # shim cannot intercept, so `dra.k8s.io/pcieRoot` stays absent from the
    # ResourceSlices it publishes. See issue #265.
    # =============================================================================
    pcie_topology:
      root_complexes:
        - id: "pci0000:00"
          numa_node: 0
          devices:
            - "0000:3B:00.0"
            - "0000:86:00.0"
            - "0000:AF:00.0"
            - "0000:D8:00.0"
