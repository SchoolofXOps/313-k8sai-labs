# research: nominal 10 cpu on the simulated fleet, no borrowing limit, so it can take whatever the
# cohort has idle. Part 2 is where that becomes starvation for product.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: research-cq
spec:
  cohortName: northwind-tenants
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/sim-accelerator"]
      flavors:
        - name: sim-fleet
          resources:
            - name: cpu
              nominalQuota: "10"
            - name: memory
              nominalQuota: 64Gi
            - name: example.com/sim-accelerator
              nominalQuota: "0"
        - name: real-worker
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: 2Gi
            - name: example.com/sim-accelerator
              nominalQuota: "1"
---
# data: nominal 10 cpu and a borrowing limit of 8, so it can never hold more than 18 cpu on the
# simulated fleet. Part 1's queued group asks for 32, which is why it is refused on quota.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: data-cq
spec:
  cohortName: northwind-tenants
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/sim-accelerator"]
      flavors:
        - name: sim-fleet
          resources:
            - name: cpu
              nominalQuota: "10"
              borrowingLimit: "8"
            - name: memory
              nominalQuota: 64Gi
            - name: example.com/sim-accelerator
              nominalQuota: "0"
        - name: real-worker
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: 2Gi
            - name: example.com/sim-accelerator
              nominalQuota: "1"
---
# Part 2's fix: product-cq re-applied in full. Two changes against m5/queues/product-cq.yaml:
#   preemption   — product may now take back quota that a lower-priority group in the cohort
#                  borrowed from it, and may preempt lower priority inside its own queue;
#   lendingLimit — product lends at most 2 of its 10 simulated-fleet cpu, so the other tenants can
#                  never borrow it down to nothing again.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: product-cq
spec:
  cohortName: northwind-tenants
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    reclaimWithinCohort: LowerPriority
    withinClusterQueue: LowerPriority
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/sim-accelerator"]
      flavors:
        - name: sim-fleet
          resources:
            - name: cpu
              nominalQuota: "10"
              lendingLimit: "2"
            - name: memory
              nominalQuota: 64Gi
            - name: example.com/sim-accelerator
              nominalQuota: "0"
        - name: real-worker
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: 2Gi
            - name: example.com/sim-accelerator
              nominalQuota: "1"
---
# Part 3: the device workload's own queue. Its ONLY flavour is the real worker, and its device quota
# is 0, so a counted device can never be admitted here. It has no cohort, so nothing can be borrowed.
# Why a queue of its own: with Kueue's DRA integration switched off, Kueue cannot see the device, so
# a two-flavour group would send the workload to the simulated fleet, where no ResourceSlice exists
# and its claim can never be allocated (SPIKE-11, planning/lab-tests/spike-11-kueue-dra-accounting.md).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: devices-cq
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/sim-accelerator"]
      flavors:
        - name: real-worker
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: 1Gi
            - name: example.com/sim-accelerator
              nominalQuota: "0"
---
# Part 4: the topology queue. Quota is set high on purpose (9 cpu, 300Gi) so it never decides
# anything here; the topology does.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: topology-cq
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/sim-accelerator"]
      flavors:
        - name: sim-fleet-blocks
          resources:
            - name: cpu
              nominalQuota: "9"
            - name: memory
              nominalQuota: 300Gi
            - name: example.com/sim-accelerator
              nominalQuota: "0"
